# On every push: the C3 Life server's tests on a Windows computer (GitHub's Windows Server runner), and on Linux to
# compare, then the installer on Windows. These computers have no Wing, Dante, Tio or Lightkey: the tests use the
# pretend ones, and real hardware is still checked with HARDWARE-CHECK.md on the HP.
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server-tests:
    name: Server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Listen turns the Dante audio into MP3 with ffmpeg; on the HP the installer asks for it
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Run every server test
        working-directory: server
        run: python -m unittest -v
        timeout-minutes: 30

  installer:
    name: Installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make the booth user (as in the set-up guide, step 2)
        shell: pwsh
        run: |
          $pw = ConvertTo-SecureString ("C3-" + [guid]::NewGuid().ToString()) -AsPlainText -Force
          New-LocalUser -Name booth -Password $pw -FullName 'Booth' | Out-Null
      - name: Run Install-C3Life.ps1
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          # Port 80 is already taken on GitHub's Windows computer, so this run uses 8080
          .\Install-C3Life.ps1 -Yes -NoKiosk -NoSubtitles -Languages '' -Port 8080
      - name: What is on port 8080 after the install
        shell: pwsh
        run: |
          # the lists in config.json must stay lists (an empty one once came out as null)
          python -c "import json; d = json.load(open(r'C:\C3Life\server\config.json', encoding='utf-8-sig')); bad = [k for k in ('allowed_networks', 'remote_networks', 'remote_support_roles') if not isinstance(d.get(k), list)]; print('config.json lists:', {k: d.get(k) for k in ('allowed_networks', 'remote_networks', 'remote_support_roles')}); assert not bad, bad"
          Get-ScheduledTask | Where-Object TaskName -like '*C3*' | Format-Table TaskName, State -AutoSize | Out-String | Write-Host
          foreach ($c in @(Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue)) {
            $w = Get-CimInstance Win32_Process -Filter "ProcessId=$($c.OwningProcess)"
            Write-Host "Listening on 8080: $($w.ProcessId) $($w.CommandLine)"
          }
          # The booth user never signs in here, so stop whatever the scheduled task started and run C3 Life directly
          Get-ScheduledTask | Where-Object TaskName -like '*C3*' | Stop-ScheduledTask -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*c3life_server.py*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
      - name: Start C3 Life and ask it how it is
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          # After 60 s Python writes where every thread is, so a hang shows where it is stuck
          $code = "import faulthandler, sys; faulthandler.dump_traceback_later(60, exit=True); sys.path.insert(0, r'C:\C3Life\server'); import c3life_server; c3life_server.main(['--config', r'C:\C3Life\server\config.json', '--log', r'C:\C3Life\logs\ci-server.log'])"
          $p = Start-Process $py -ArgumentList '-c', "`"$code`"" -PassThru -RedirectStandardOutput C:\C3Life\logs\ci-out.txt -RedirectStandardError C:\C3Life\logs\ci-err.txt
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep 2
            try { $h = Invoke-RestMethod http://127.0.0.1:8080/api/health -TimeoutSec 3; $ok = $h.ok; if ($ok) { break } } catch { Write-Host "  not yet: $($_.Exception.Message)" }
          }
          if (-not $ok) {
            Start-Sleep 25
            Write-Host '--- C3 Life output'; Get-Content C:\C3Life\logs\ci-out.txt -ErrorAction SilentlyContinue
            Write-Host '--- C3 Life errors'; Get-Content C:\C3Life\logs\ci-err.txt -ErrorAction SilentlyContinue
            Write-Host '--- C3 Life log'; Get-Content C:\C3Life\logs\ci-server.log -ErrorAction SilentlyContinue
            throw 'C3 Life did not answer on http://127.0.0.1:8080/api/health'
          }
          "C3 Life $($h.version) is up, serving the $($h.app) folder"
          $to = curl.exe -s -o NUL -w "%{redirect_url}" http://127.0.0.1:8080/
          if ($to -notlike '*Listen.dc.html*') { throw "The address should open Listen, not '$to'" }
          "The address opens: $to"
          Invoke-WebRequest http://127.0.0.1:8080/project/Lights.dc.html -UseBasicParsing -TimeoutSec 5 | Out-Null
          'Lights page served'
          Stop-Process $p
      - name: Keep the install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs
          path: C:\C3Life\logs

  helper-windows:
    name: Helper installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the helper, check it, take it off again
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\helper\Install-Helper.ps1 -Yes
          $t = Get-ScheduledTask -TaskName 'C3 Life helper'
          "Logon task: $($t.State), runs $($t.Actions[0].Execute) $($t.Actions[0].Arguments)"
          if ($t.Triggers[0].CimClass.CimClassName -ne 'MSFT_TaskLogonTrigger') { throw 'It should start at logon' }
          if ($t.Actions[0].Execute -notlike '*pythonw.exe') { throw 'It should run hidden (pythonw.exe)' }
          $fw = Get-NetFirewallRule -DisplayName 'C3 Life helper' | Get-NetFirewallPortFilter
          if ($fw.LocalPort -ne '8099') { throw 'The firewall rule should open port 8099' }
          $h = Invoke-RestMethod http://127.0.0.1:8099/hello -TimeoutSec 5
          "It answers: $($h.name), os $($h.os), can $($h.can -join ', ')"
          if ($h.os -ne 'windows' -or $h.can -notcontains 'spotify') { throw 'It should say it is a Windows helper that can do Spotify' }
          $cfg = Get-Content "$env:LOCALAPPDATA\C3 Life Helper\helper.json" | ConvertFrom-Json
          try { Invoke-RestMethod http://127.0.0.1:8099/status -TimeoutSec 5 | Out-Null; throw 'status needs the key' } catch { if ($_.Exception.Message -eq 'status needs the key') { throw } }
          $st = Invoke-RestMethod http://127.0.0.1:8099/status -Headers @{ 'X-C3Life-Key' = $cfg.key } -TimeoutSec 5
          if (-not $st.ok) { throw 'status with the key should answer' }
          # installed again: the same key
          .\helper\Install-Helper.ps1 -Yes
          if ((Get-Content "$env:LOCALAPPDATA\C3 Life Helper\helper.json" | ConvertFrom-Json).key -ne $cfg.key) { throw 'The key should stay the same' }
          .\helper\Uninstall-Helper.ps1 -Yes
          if (Get-ScheduledTask -TaskName 'C3 Life helper' -ErrorAction SilentlyContinue) { throw 'The logon task should be gone' }
          if (Get-NetFirewallRule -DisplayName 'C3 Life helper' -ErrorAction SilentlyContinue) { throw 'The firewall rule should be gone' }
          Start-Sleep 2
          try { Invoke-RestMethod http://127.0.0.1:8099/hello -TimeoutSec 3 | Out-Null; throw 'still answering' } catch { if ($_.Exception.Message -eq 'still answering') { throw } }
          'Installed, answered, kept its key, and came off cleanly'

  helper-mac:
    name: Helper installer (Mac)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the helper, check it, take it off again
        run: |
          bash helper/Install-Helper.command --yes
          launchctl list | grep org.c3life.helper
          plutil -lint ~/Library/LaunchAgents/org.c3life.helper.plist
          grep -q '<key>RunAtLoad</key><true/>' ~/Library/LaunchAgents/org.c3life.helper.plist
          grep -q '<key>KeepAlive</key><true/>' ~/Library/LaunchAgents/org.c3life.helper.plist
          h=$(curl -s -m 5 http://127.0.0.1:8099/hello); echo "It answers: $h"
          echo "$h" | python3 -c 'import json,sys; j=json.load(sys.stdin); assert j["os"]=="mac" and "spotify_more" in j["can"], j'
          key=$(python3 -c 'import json,os; print(json.load(open(os.path.expanduser("~/Library/Application Support/C3 Life Helper/helper.json")))["key"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/status)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-C3Life-Key: $key" http://127.0.0.1:8099/status)" = 200
          # it restarts if it stops
          pkill -f 'C3 Life Helper/c3life_helper.py'; sleep 15
          curl -s -m 5 http://127.0.0.1:8099/hello | grep -q c3life-helper
          # installed again: the same key
          bash helper/Install-Helper.command --yes
          test "$(python3 -c 'import json,os; print(json.load(open(os.path.expanduser("~/Library/Application Support/C3 Life Helper/helper.json")))["key"])')" = "$key"
          bash helper/Uninstall-Helper.command --yes
          ! launchctl list | grep -q org.c3life.helper
          sleep 2; ! curl -s -m 3 http://127.0.0.1:8099/hello
          echo 'Installed, answered, restarted itself, kept its key, and came off cleanly'
