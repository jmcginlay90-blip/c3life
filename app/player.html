<script>
/* Team chat on or off for the person signed in (Users & PINs; Listeners don't have it unless an Admin turns it on). */
(function(){
  function get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
  function chatOk(){var u=get('booth.user');if(!u)return true;var l=get('booth.users'),me=null;if(Array.isArray(l))for(var i=0;i<l.length;i++)if(l[i].name===u.name)me=l[i];if(me&&typeof me.chat==='boolean')return me.chat;return (u.role||u.name)!=='Listener';}
  function foyerName(){var c=get('booth.foyer');return c&&typeof c.name==='string'&&c.name.trim()?c.name.trim():'Foyer';}
  /* menus and tabs that say "Foyer" use the foyer's own name */
  function names(){var n=foyerName(),a=document.querySelectorAll('a[href="FoyerTeam.dc.html"],a[href="FoyerSimple.dc.html"],a[href="Foyer.dc.html"]');for(var i=0;i<a.length;i++){var k=a[i].childNodes;for(var j=k.length-1;j>=0;j--){var t=k[j];if(t.nodeType===3&&t.nodeValue.trim()){if(t.nodeValue.trim()==='Foyer'&&n!=='Foyer')t.nodeValue=t.nodeValue.replace('Foyer',n);break;}}}}
  function apply(){var no=!chatOk(),h=document.documentElement;if(no!==h.hasAttribute('data-nochat')){if(no)h.setAttribute('data-nochat','');else h.removeAttribute('data-nochat');}names();}
  apply();setInterval(apply,1000);
  try{window.addEventListener('storage',apply);}catch(e){}
  try{new MutationObserver(names).observe(document.getElementById('app')||document.body,{childList:true,characterData:true,subtree:true});}catch(e){}
})();
</script>

<script>
/* Something that's set up has stopped answering (the Wing, the Tio, ProPresenter, Lightkey, a C3 Life helper): a warning on
   every screen, for whoever is signed in and can see it (GET /api/devices, every 15 seconds). It shows in full, then after
   8 seconds shrinks to a small badge in the corner so it doesn't sit on top of the controls; tap the badge for the details.
   Hide hides it for 10 minutes on this device. In the preview (no C3 Life server) there's nothing to ask, so nothing shows. */
(function(){
  var off=false, box=null, last=[], shrinkT=null, AREA={Mixer:'Mixer',Show:'Show',Music:'Music',Lights:'Lights'};
  function tok(){try{var x=JSON.parse(localStorage.getItem('booth.session')||'null');return x?x.token:'';}catch(e){return '';}}
  function hidden(){try{return JSON.parse(sessionStorage.getItem('booth.devwarn')||'{}')||{};}catch(e){return {};}}
  function hhmm(t){var d=new Date(t*1000);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  function el(tag,txt,attrs){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;for(var k in attrs||{})e.setAttribute(k,attrs[k]);return e;}
  function show(list){
    last=list||[];var h=hidden(),now=Date.now();
    var w=last.filter(function(d){return d.warn&&!(h[d.id]>now);});
    if(!w.length){if(box){box.remove();box=null;}return;}
    var key=JSON.stringify(w.map(function(d){return [d.id,d.since];}));
    key+='|'+(window.__page||'');
    if(box&&box.getAttribute('data-k')===key)return;  // the same as shown: leave it alone
    var isNew=!box||box.getAttribute('data-ids')!==w.map(function(d){return d.id;}).join();
    if(!box){box=el('div',null,{id:'devwarn',role:'alert'});document.body.appendChild(box);}
    box.setAttribute('data-k',key);box.setAttribute('data-ids',w.map(function(d){return d.id;}).join());box.textContent='';
    if(isNew){box.classList.remove('small');clearTimeout(shrinkT);shrinkT=setTimeout(function(){if(box)box.classList.add('small');},8000);}
    var open=el('button','\u26A0 '+w.length+' not answering',{type:'button','class':'open','aria-label':w.length+' not answering: show'});
    open.addEventListener('click',function(){box.classList.remove('small');clearTimeout(shrinkT);shrinkT=setTimeout(function(){if(box)box.classList.add('small');},8000);});
    box.appendChild(open);
    w.forEach(function(d){
      var r=el('div',null,{'class':'dw'});
      var b=el('b','⚠ '+d.name+' isn’t answering');r.appendChild(b);
      r.appendChild(el('span','since '+hhmm(d.since)));
      if(d.where&&(window.__page||location.search).indexOf(d.where)<0)r.appendChild(el('a','Open '+(AREA[d.area]||d.area)+' ›',{href:d.where}));
      r.appendChild(el('small',d.why+' C3 Life is looking for it on the network.'));
      box.appendChild(r);
    });
    var btn=el('button','Hide for 10 minutes',{type:'button','class':'hide'});
    btn.addEventListener('click',function(){var hh=hidden(),u=Date.now()+600000;w.forEach(function(d){hh[d.id]=u;});try{sessionStorage.setItem('booth.devwarn',JSON.stringify(hh));}catch(e){}show(last);});
    box.appendChild(btn);
  }
  function poll(){
    if(off)return;var t=tok();if(!t){show([]);return;}
    fetch('/api/devices',{headers:{Authorization:'Bearer '+t}}).then(function(r){
      if(r.status===404){off=true;show([]);return null;}
      if(!r.ok){show([]);return null;}
      return r.json();
    }).then(function(j){if(j&&j.devices)show(j.devices);}).catch(function(){});
  }
  window.__devwarn=poll;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',poll);else poll();
  setInterval(poll,15000);
})();
</script>
<script>
class DCLogic { constructor(p){ this.props=p||{}; this.state={}; } setState(p){ const v = typeof p==='function'? p(this.state):p; this.state=Object.assign({}, this.state, v); queueMicrotask(()=> this.__rerender ? this.__rerender() : window.__render()); } }
let comp=null, tpl=null, errors=[]; let defs={}, insts=[], hosts=[];
window.onerror=(m)=>{errors.push(String(m));};
window.__errors=()=>errors;
function look(expr, scope){ expr=expr.trim(); if(expr==='true')return true; if(expr==='false')return false; return expr.split('.').reduce((o,k)=>o==null?undefined:o[k], scope); }
const RX=/\{\{([^}]+)\}\}/g;
function interp(str, scope){ const m=str.match(/^\{\{([^}]+)\}\}$/); if(m) return look(m[1],scope); return str.replace(RX,(_,e)=>{const v=look(e,scope); return v==null?'':v;}); }
function walk(node, scope, out){
  if(node.nodeType===3){ out.appendChild(document.createTextNode(String(interp(node.textContent,scope)??''))); return; }
  if(node.nodeType!==1) return;
  const tag=node.tagName.toLowerCase();
  if(tag==='sc-if'){ if(look(node.getAttribute('value').replace(/[{}]/g,''),scope)) node.childNodes.forEach(c=>walk(c,scope,out)); return; }
  if(tag==='sc-for'){ const list=look(node.getAttribute('list').replace(/[{}]/g,''),scope)||[]; const as=node.getAttribute('as'); list.forEach(it=>{const s=Object.assign(Object.create(scope),{[as]:it}); node.childNodes.forEach(c=>walk(c,s,out));}); return; }
  if(tag==='dc-import'){ const h=document.createElement('div'); h.className='dcimp'; h.dataset.name=node.getAttribute('name'); hosts.push(h); out.appendChild(h); return; }
  const el = node.namespaceURI==='http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(tag);
  for(const a of node.attributes){
    const v=interp(a.value,scope);
    if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ if(typeof v==='function'){ let ev=a.name.slice(2).toLowerCase(); if(ev==='change'&&(tag==='input'&&!['checkbox','radio'].includes(node.getAttribute('type'))||tag==='textarea')) ev='input'; (el.__h||(el.__h={}))[ev]=v; listen(el,ev);} continue; }
    if(['disabled','checked','selected','hidden'].includes(a.name)&&a.value.includes('{{')){ if(v) el.setAttribute(a.name,''); continue; }
    if(a.name==='value'&&(tag==='input'||tag==='select'||tag==='textarea')){ el.__val=v; }
    el.setAttribute(a.name, v==null?'':v);
  }
  node.childNodes.forEach(c=>walk(c,scope,el));
  if(el.__val!==undefined) setTimeout(()=>{el.value=el.__val;});
  out.appendChild(el);
}
// Each render is compared with what's on screen, and only what changed is changed. The element you're typing in or
// dragging stays the same element (Safari drops keystrokes and drags when it's swapped for a new one), animations keep
// running, and scroll positions and open drop-downs stay as they are.
function listen(el,ev){ const on=el.__on||(el.__on={}); if(on[ev]) return; on[ev]=1; el.addEventListener(ev,(e)=>{ const f=el.__h&&el.__h[ev]; if(f) return f(e); }); }
function sameNode(o,n){ if(o.nodeType!==n.nodeType) return false; if(o.nodeType!==1) return true; if(o.namespaceURI!==n.namespaceURI||o.tagName!==n.tagName) return false;
  if((o.id||n.id)&&o.id!==n.id) return false; if(o.classList&&o.classList.contains('dcimp')) return n.classList.contains('dcimp')&&o.dataset.name===n.dataset.name;
  if(o.tagName==='INPUT'&&o.type!==(n.getAttribute('type')||'text')) return false; return true; }
function patchNode(o,n){
  if(o.nodeType!==1){ if(o.nodeValue!==n.nodeValue) o.nodeValue=n.nodeValue; return; }
  for(const a of [...o.attributes]){ if(!n.hasAttribute(a.name)&&!(a.name==='open'&&o.tagName==='DETAILS')&&!(a.name==='style'&&o.tagName==='BUTTON'&&window.__onServer)) o.removeAttribute(a.name); }
  for(const a of n.attributes){ if(o.getAttribute(a.name)!==a.value) o.setAttribute(a.name,a.value); }
  o.__h=n.__h; if(n.__on) Object.keys(n.__on).forEach(ev=>listen(o,ev));
  const t=o.tagName;
  if(t==='INPUT'&&(o.type==='checkbox'||o.type==='radio')) o.checked=n.hasAttribute('checked');
  if(t==='OPTION') o.selected=n.hasAttribute('selected');
  if(o.classList.contains('dcimp')){ const k=hosts.indexOf(n); if(k>-1) hosts[k]=o; return; }  // a child screen draws itself in here
  morph(o,n);
  if(n.__val!==undefined){ const v=n.__val==null?'':String(n.__val); if(!(document.activeElement===o&&o.value===v)&&o.value!==v){ o.value=v; if(t==='SELECT') setTimeout(()=>{ if(o.value!==v) o.value=v; }); } }
}
function morph(cur,next){
  const a=[...cur.childNodes], b=[...next.childNodes];
  for(let i=0;i<b.length;i++){ const o=a[i], n=b[i];
    if(!o){ cur.appendChild(n); continue; }
    if(sameNode(o,n)) patchNode(o,n); else cur.replaceChild(n,o); }
  for(let i=b.length;i<a.length;i++) a[i].remove();
}
// On the C3 Life server the app is real, so the mock-up's "Demo: ..." buttons (which fake a state) are hidden.
function hideDemos(root){ if(!window.__onServer) return; root.querySelectorAll('button').forEach(b=>{ if(/^\s*Demo:/.test(b.textContent)) b.style.display='none'; }); }
fetch('/api/health').then(r=>r.ok?r.json():null).then(h=>{ if(h&&h.service==='c3life'){ window.__onServer=true; hideDemos(document.getElementById('app'));
  // Remote support: say so on every screen, so nobody forgets they're changing the booth from outside
  if(h.remote && !/Listen\.dc\.html/.test(location.search)){ const b=document.createElement('div'); b.id='remote-badge'; b.setAttribute('role','status'); b.textContent='Remote support \u00b7 connected from outside the building'; b.style.cssText='position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:50;pointer-events:none;background:#B48CF2;color:#0D1015;font:600 12px IBM Plex Sans,system-ui,sans-serif;border-radius:999px;padding:5px 12px;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap'; document.body.appendChild(b); } } }).catch(()=>{});
function renderChild(inst){ try{ const v=inst.renderVals(); const f=document.createDocumentFragment(); const saved=hosts; hosts=[]; inst.__def.tpl.childNodes.forEach(c=>walk(c,v,f)); morph(inst.__host,f); hosts=saved; hideDemos(inst.__host);}catch(e){errors.push(e.stack);} }
window.__render=()=>{ if(!comp) return; const app=document.getElementById('app'); const act=document.activeElement; const id=act&&act.id; const al=act&&act.getAttribute&&act.getAttribute('aria-label'); hosts=[]; const openD=[...app.querySelectorAll('details')].map(d=>d.open); const scr=[...app.querySelectorAll('main')].map(m=>m.scrollTop); const scl=[...app.querySelectorAll('.strips')].map(m=>m.scrollLeft); const sct=[...app.querySelectorAll('.subs')].map(m=>({t:m.scrollTop,end:m.scrollHeight-m.scrollTop-m.clientHeight<40})); try{ const vals=comp.renderVals(); const frag=document.createDocumentFragment(); tpl.childNodes.forEach(c=>walk(c,vals,frag)); morph(app,frag);}catch(e){errors.push(e.stack);} app.querySelectorAll('details').forEach((d,i)=>{ if(openD[i]) d.open=true; }); app.querySelectorAll('main').forEach((m,i)=>{ if(scr[i]) m.scrollTop=scr[i]; }); app.querySelectorAll('.strips').forEach((m,i)=>{ if(scl[i]) m.scrollLeft=scl[i]; }); app.querySelectorAll('.subs').forEach((m,i)=>{ const v=sct[i]; if(!v) return; m.scrollTop = v.end ? m.scrollHeight : v.t; }); hideDemos(app);
  hosts.forEach((h,k)=>{ const d=defs[h.dataset.name]; if(!d) return; let inst=insts[k]; const fresh=!inst||inst.__def!==d; if(fresh){ inst=new d.C({}); inst.__def=d; insts[k]=inst; } inst.__host=h; inst.__rerender=()=>renderChild(inst); renderChild(inst); if(fresh&&inst.componentDidMount) inst.componentDidMount(); });
  if(id){const n=document.getElementById(id); n&&n.focus({preventScroll:true});} else if(al && act!==document.body){ const n=[...app.querySelectorAll('[aria-label]')].find(x=>x.getAttribute('aria-label')===al); n&&n.focus({preventScroll:true}); } };
async function compile(name){ const txt=await (await fetch('/project/'+name)).text(); const doc=new DOMParser().parseFromString(txt,'text/html'); const x=doc.querySelector('x-dc'); const helm=x.querySelector('helmet'); let css=''; if(helm){ css=helm.innerHTML; helm.remove(); } const sc=doc.querySelector('script[data-dc-script]').textContent; const C=new Function('DCLogic', sc+'; return Component;')(DCLogic); return {tpl:x, C, css}; }
let loadId=0;
function app_reset(){ document.getElementById('app').replaceChildren(); }
async function load(name){
  const my=++loadId;
  if(comp&&comp.componentWillUnmount) comp.componentWillUnmount(); insts.forEach(i=>i&&i.componentWillUnmount&&i.componentWillUnmount()); insts=[];
  const res=await fetch('/project/'+name); const txt=await res.text(); if(my!==loadId) return;
  if(res.status===403){ // from outside the building: only Listen (and, for remote support, signing in)
    const a=document.getElementById('app'); a.innerHTML='<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#0D1015;color:#ECEEF1;font:400 15px IBM Plex Sans,system-ui,sans-serif"><div style="font-size:20px;font-weight:600">This page is for the booth</div><div style="color:#A3ACB8;max-width:340px;line-height:1.5">From outside the building you can use Listen. Admins helping from home: sign in first.</div><a href="player.html?p=Listen.dc.html" style="color:#0D1015;background:#4FD18B;border-radius:10px;padding:12px 18px;text-decoration:none;font-weight:600">Open Listen</a><a href="player.html?p=User.dc.html" style="color:#6CB4F5">Sign in (Admins)</a></div>';
    return;
  }
  const doc=new DOMParser().parseFromString(txt,'text/html');
  const x=doc.querySelector('x-dc'); const helm=x.querySelector('helmet');
  document.querySelectorAll('.helm').forEach(n=>n.remove());
  if(helm){ const d=document.createElement('div'); d.className='helm'; d.innerHTML=helm.innerHTML; document.head.appendChild(d); helm.remove(); }
  const nd={};
  for(const n of new Set([...x.querySelectorAll('dc-import')].map(e=>e.getAttribute('name')))){ try{ nd[n]=await compile(n+'.dc.html'); }catch(e){errors.push('import '+n+': '+e);} if(my!==loadId) return; }
  tpl=x; defs=nd; Object.values(nd).forEach(v=>{ const d=document.createElement('div'); d.className='helm'; d.innerHTML=v.css; document.head.appendChild(d); });
  const sc=doc.querySelector('script[data-dc-script]').textContent;
  const C=new Function('DCLogic', sc+'; return Component;')(DCLogic);
  app_reset(); comp=new C({}); window.__comp=comp; window.__page=name;
  window.__render(); if(comp.componentDidMount) comp.componentDidMount(); window.__render();
}
document.addEventListener('click',e=>{const a=e.target.closest('a'); if(!a)return; const h=(a.getAttribute('href')||'').split('#')[0]; if(h.endsWith('.dc.html')){e.preventDefault(); load(h);} else if(h.startsWith('http')) e.preventDefault();});

 'Connect.dc.html':['Internet and schedule','The internet is only for Planning Center and sending reports. The desk, Dante and the show never need it.']
};
function screenHelp(){
  const h=SCREEN_HELP[window.__page]; if(!h) return;
  let o=document.getElementById('screen-help'); if(o){ o.remove(); return; }
  o=document.createElement('div'); o.id='screen-help'; o.setAttribute('role','dialog'); o.setAttribute('aria-label','Help with this screen');
  o.style.cssText='position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px';
  const c=document.createElement('div'); c.style.cssText='background:#1A1C20;color:#ECEEF1;border:1px solid #F5C518;border-radius:16px;padding:18px;max-width:520px;width:100%;font:400 16px/1.5 IBM Plex Sans,system-ui,sans-serif;display:flex;flex-direction:column;gap:10px;max-height:80dvh;overflow:auto';
  const t=document.createElement('div'); t.style.cssText='font-size:19px;font-weight:600'; t.textContent='Help: '+h[0]; c.appendChild(t);
  h.slice(1).forEach(x=>{ const pp=document.createElement('div'); pp.textContent=x; c.appendChild(pp); });
  const row=document.createElement('div'); row.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px';
  const more=document.createElement('button'); more.textContent='More help'; const ok=document.createElement('button'); ok.textContent='Close';
  [more,ok].forEach((b,i)=>{ b.style.cssText='min-height:52px;border-radius:12px;font:600 16px IBM Plex Sans,system-ui,sans-serif;cursor:pointer;border:1px solid '+(i?'#F5C518;background:#F5C518;color:#1A1204':'#3A3F47;background:#26282C;color:#ECEEF1'); row.appendChild(b); });
  more.onclick=()=>{ o.remove(); load('Help.dc.html'); }; ok.onclick=()=>o.remove(); o.onclick=(e)=>{ if(e.target===o) o.remove(); };
  c.appendChild(row); o.appendChild(c); document.body.appendChild(o); ok.focus();
}
window.__screenHelp=screenHelp;
// Put the button at the bottom of each menu (the drop-down menu and the side menu), after every draw.
new MutationObserver(()=>{ if(!SCREEN_HELP[window.__page]) return; document.querySelectorAll('#app .mlist, #app .wkside').forEach(m=>{ if(m.querySelector('.sh-btn')) return; const b=document.createElement('button'); b.type='button'; b.className='sh-btn'; b.textContent='? Help with this screen'; b.style.cssText='display:flex;align-items:center;width:100%;min-height:48px;padding:0 14px;border:0;border-top:1px solid #2A2F38;background:transparent;color:#F5C518;font:600 15px IBM Plex Sans,system-ui,sans-serif;cursor:pointer;text-align:left'; b.onclick=(e)=>{ e.preventDefault(); const d=b.closest('details'); if(d) d.open=false; screenHelp(); }; m.appendChild(b); }); }).observe(document.getElementById('app'),{childList:true,subtree:true});
// Opened from the app's address ("/" adds start=1): Listen, unless someone is already signed in on this device,

load((function(){var q=new URLSearchParams(location.search),p=q.get('p')||'Main.dc.html';if(q.get('start')==='1'){try{var u=JSON.parse(localStorage.getItem('booth.user')||'null'),x=JSON.parse(localStorage.getItem('booth.session')||'null');if(u&&x&&x.token&&(!x.expires||x.expires*1000>Date.now()))p=u.role==='Foyer team'?'FoyerSimple.dc.html':(u.role==='Musician'?'MyMix.dc.html':(u.role==='Listener'?'Listen.dc.html':(localStorage.getItem('booth.view.'+u.name)==='simple'?'HomeSimple.dc.html':'Main.dc.html')));}catch(e){}}return p;})());
