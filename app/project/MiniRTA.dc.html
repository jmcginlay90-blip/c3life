<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C3 Life – Mini RTA bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" data-look>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Safari / iPad: no zoom when typing, no double-tap zoom, no text-select or callout while dragging */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,a,summary,label,[role=slider]{-webkit-tap-highlight-color:transparent}
[role=slider],.fader,.pan{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0}
/* look:start — the WING look (like WING Edit): near-black, outlined panels, condensed headings, yellow for active, blue for selected.
   Settings › Look › Classic puts the old look back on this device (html[data-look=classic]). */
:root{--wk-bg:#0A0B0D;--wk-panel:#121418;--wk-panel2:#181B20;--wk-line:#2E333A;--wk-yellow:#F5C518;--wk-blue:#2F6CC4;--wk-cond:'Barlow Condensed','IBM Plex Sans',system-ui,sans-serif}
html:not([data-look=classic]) body{background:var(--wk-bg)}
html:not([data-look=classic]) .app{background:var(--wk-bg) !important}
html:not([data-look=classic]) .card{background:var(--wk-panel);border-color:var(--wk-line);border-radius:6px}
html:not([data-look=classic]) .lbl{font-family:var(--wk-cond);font-size:13px;font-weight:600;letter-spacing:.07em;color:#D4D9E0}
html:not([data-look=classic]) h1{font-family:var(--wk-cond);font-weight:600 !important;text-transform:uppercase;letter-spacing:.05em;font-size:21px !important;line-height:1.2;color:var(--wk-yellow);border:1.5px solid var(--wk-yellow);border-radius:3px;padding:2px 12px;display:inline-block}
html:not([data-look=classic]) .btn,html:not([data-look=classic]) .lk,html:not([data-look=classic]) .mxb,html:not([data-look=classic]) .mxbk,html:not([data-look=classic]) .mute,html:not([data-look=classic]) .pbtn{font-family:var(--wk-cond);font-size:15px;letter-spacing:.02em;border-radius:4px}
html:not([data-look=classic]) .btn.pri{background:var(--wk-yellow);border-color:var(--wk-yellow);color:#111}
html:not([data-look=classic]) .seg{background:var(--wk-panel);border-color:var(--wk-line);border-radius:6px}
html:not([data-look=classic]) .seg a{font-family:var(--wk-cond);font-size:15px;letter-spacing:.03em;border-radius:4px}
html:not([data-look=classic]) .seg a.on,html:not([data-look=classic]) .lk.on{background:var(--wk-blue);color:#fff}
html:not([data-look=classic]) .tab.on{color:var(--wk-yellow);border-top-color:var(--wk-yellow)}
html:not([data-look=classic]) .topmenu{background:#000;border-bottom-color:var(--wk-line)}
html:not([data-look=classic]) .topmenu summary{font-family:var(--wk-cond);font-size:16px;letter-spacing:.03em}
html:not([data-look=classic]) .topmenu .mcur{color:var(--wk-yellow)}
html:not([data-look=classic]) .topmenu .mlist{background:var(--wk-panel);border-color:var(--wk-line);border-radius:6px}
html:not([data-look=classic]) .topmenu .mlist a{font-family:var(--wk-cond);font-size:16px;border-radius:4px}
html:not([data-look=classic]) .topmenu .mlist a.on{background:var(--wk-panel2);color:var(--wk-yellow);box-shadow:inset 3px 0 0 var(--wk-yellow)}
html:not([data-look=classic]) input[type=checkbox],html:not([data-look=classic]) input[type=radio],html:not([data-look=classic]) input[type=range]{accent-color:var(--wk-yellow)}
.wkside{display:none}
/* iPad landscape and laptops: a sidebar like WING Edit's (HOME, MIXER, ...) instead of the menu at the top */
@media (min-width:1000px){
  html:not([data-look=classic]) .wkside{display:flex;flex-direction:column;gap:2px;position:fixed;left:0;top:0;bottom:0;width:132px !important;max-width:132px !important;margin:0 !important;padding:8px 6px 12px;box-sizing:border-box;background:#000;border-right:1px solid var(--wk-line);overflow-y:auto;z-index:30}
  html:not([data-look=classic]) .wkside .wkbrand{font:700 24px var(--wk-cond);letter-spacing:.06em;color:var(--wk-yellow);padding:6px 8px 12px}
  html:not([data-look=classic]) .wkside a{display:flex;align-items:center;gap:9px;min-height:46px;padding:0 8px;border-radius:4px;color:#D4D9E0;text-decoration:none;font:600 15px var(--wk-cond);text-transform:uppercase;letter-spacing:.04em}
  html:not([data-look=classic]) .wkside a:hover{background:var(--wk-panel2)}
  html:not([data-look=classic]) .wkside a.on{background:var(--wk-panel2);color:var(--wk-yellow);box-shadow:inset 3px 0 0 var(--wk-yellow)}
  html:not([data-look=classic]) .wkside svg{flex:none}
  html:not([data-look=classic]) .app{padding-left:132px;box-sizing:border-box !important}
  html:not([data-look=classic]) .app > .topmenu{display:none}
}
/* look:end */
</style>
</helmet>
<div style="width:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#ECEEF1">
  <div role="status" aria-label="{{aria}}" style="display:flex;align-items:center;gap:10px;box-sizing:border-box;width:100%;min-height:{{barH}}px;padding:4px 8px 4px 12px;background:{{bg}};border-top:1px solid {{border}};transition:background-color .25s">
    <a href="RTA.dc.html" style="display:flex;align-items:baseline;gap:6px;text-decoration:none;color:#ECEEF1;flex:none;min-height:36px;align-items:center" aria-label="Open full RTA">
      <span style="font-size:11px;font-weight:600;letter-spacing:.06em">{{label}}</span>
      <span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:20px;color:{{numColor}}">{{spl}}</span>
      <span style="font-size:11px;color:#C9CFD7">dB(A)</span>
    </a>
    <sc-if value="{{full}}" hint-placeholder-val="{{ true }}">
      <a href="RTA.dc.html" style="flex:1;min-width:0;display:flex;gap:1px;align-items:flex-end;height:28px;text-decoration:none" aria-hidden="true" tabindex="-1">
        <sc-for list="{{bands}}" as="b" hint-placeholder-count="31">
          <span style="flex:1;border-radius:1px 1px 0 0;background:{{barColor}};height:{{b.h}}px"></span>
        </sc-for>
      </a>
      <span style="font-size:11px;color:#C9CFD7;flex:none;text-align:right;line-height:1.3">Peak <span style="font-family:'IBM Plex Mono',ui-monospace,monospace;color:#ECEEF1">{{peak}}</span><br>Limit {{limit}}</span>
    </sc-if>
    <sc-if value="{{slim}}" hint-placeholder-val="{{ false }}">
      <span style="flex:1;font-size:12px;color:#C9CFD7">Limit {{limit}} · peak {{peak}}</span>
    </sc-if>
    <button onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width:36px;height:36px;flex:none;border-radius:8px;border:1px solid #333B47;background:#1E232C;color:#ECEEF1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{toggleIcon}}"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"limit":{"editor":"int","default":90,"min":70,"max":110},"$preview":{"width":390,"height":48}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slim: this.readSlim(), vals: new Array(31).fill(60), spl: 88.6, avg: 88.6, peak: 93.0 };
  }
  // Full or slim is remembered on this device, so it stays the same on every screen.
  readSlim() { try { return localStorage.getItem('booth.rtabar') === 'slim'; } catch (e) { return false; } }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state;
      const vals = s.vals.map((v, i) => {
        const base = 84 - i * 0.5 + (i > 3 && i < 11 ? 5 : 0) + (i > 26 ? -8 : 0) + (i < 3 ? -10 : 0);
        return v + (base + (Math.random() - 0.5) * 9 - v) * 0.45;
      });
      let spl = s.spl + (Math.random() - 0.5) * 0.9 + (89 - s.spl) * 0.01;
      spl = Math.max(82, Math.min(96, spl));
      this.setState({ vals, spl, avg: s.avg + (spl - s.avg) * 0.1, peak: Math.max(s.peak, spl) });
    }, 140);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state;
    const limit = this.props.limit ?? 90;
    const over = s.avg >= limit;
    let fb = null; try { fb = JSON.parse(localStorage.getItem('booth.feedback') || 'null'); } catch (e) {}
    return {
      full: !s.slim, slim: s.slim,
      barH: s.slim ? 40 : 48,
      toggle: () => { const v = !s.slim; try { localStorage.setItem('booth.rtabar', v ? 'slim' : 'full'); } catch (e) {} this.setState({ slim: v }); },
      toggleLabel: s.slim ? 'Show the RTA meters' : 'Make the RTA bar smaller',
      toggleIcon: s.slim ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
      bg: fb ? '#B34A1F' : (over ? '#8E1B12' : '#11151B'),
      border: over ? '#FFFFFF' : '#262C36',
      numColor: over ? '#FFFFFF' : '#F5C518',
      barColor: over ? '#FFFFFF' : '#6CB4F5',
      label: fb ? 'FEEDBACK ' + fb.freq : (over ? 'OVER ' + limit : 'ROOM'),
      spl: s.avg.toFixed(1),
      peak: s.peak.toFixed(1),
      limit: limit,
      aria: (fb ? 'Feedback ringing at ' + fb.freq + '. ' : '') + 'Room level ' + s.avg.toFixed(1) + ' dB(A)' + (over ? ', over the limit' : ''),
      bands: s.vals.map((v) => ({ h: Math.min(28, Math.max(2, Math.round(((v - 50) / 50) * 28))) }))
    };
  }
}
</script>
</body>
</html>
